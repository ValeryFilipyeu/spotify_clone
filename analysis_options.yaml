# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

# Wider than Dart's default 80. Chosen from what this codebase already is rather
# than by preference: 99% of its lines were already under 100 characters, so this
# reflows the genuine outliers and leaves everything else where the author put
# it. The data tables in the fake catalog are the clearest case -- one item per
# line reads as a table, and at 80 each becomes a five-line paragraph.
#
# Declared here and not as a `--line-length` flag on purpose: since Dart 3.7 a
# bare `dart format` reads this, so editors, pre-commit hooks and CI all agree
# without each being configured separately. A flag would only bind whoever
# remembered to pass it.
formatter:
  page_width: 100

# Written out by hand because FVM writes it otherwise, and writes it wrong: it
# appends this block whenever the file lacks it, but appends it *inside* the
# `linter:` section below, which leaves `rules:` empty and buries the commented
# examples under `exclude`. Deleting it is not an option -- it comes straight
# back on the next `fvm` command -- so the fix is to give it nothing to add.
#
# The contents are harmless and roughly what the analyzer does anyway: none of
# these directories hold Dart source this project writes, and `build/` holds
# generated output that should never be linted.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
